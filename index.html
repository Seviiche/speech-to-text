<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KinéCom">
<title>KinéCom</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;height:100dvh;
    background:#000;color:#fff;
    overflow:hidden;
    font-family:-apple-system,system-ui,'Helvetica Neue',sans-serif;
    -webkit-text-size-adjust:100%;
  }

  /* ── START SCREEN ── */
  #startScreen{
    position:fixed;inset:0;z-index:100;
    background:#000;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:20px;padding:40px;text-align:center;
  }
  #startScreen.hidden{display:none}
  #startScreen .icon{font-size:72px}
  #startScreen h1{font-size:26px;font-weight:800}
  #startScreen p{color:rgba(255,255,255,0.45);font-size:15px;line-height:1.5;max-width:300px}
  #startScreen button{
    padding:18px 50px;
    background:#fff;color:#000;
    border:none;border-radius:50px;
    font-size:19px;font-weight:800;
    cursor:pointer;
  }
  #startScreen button:active{transform:scale(0.96)}
  #startScreen .skip{
    background:none;border:none;
    color:rgba(255,255,255,0.25);
    font-size:13px;cursor:pointer;
    text-decoration:underline;
    padding:10px;
  }

  /* ── MAIN DISPLAY ── */
  #main{
    display:none;
    flex-direction:column;
    justify-content:flex-end;
    width:100%;height:100%;height:100dvh;
    padding:20px 22px calc(70px + env(safe-area-inset-bottom,0px)) 22px;
    gap:16px;
    cursor:pointer;
  }
  #main.visible{display:flex}

  #prevPhrase{
    color:rgba(255,255,255,0.22);
    font-weight:600;
    line-height:1.2;
    word-break:break-word;
    max-height:30vh;
    overflow:hidden;
  }

  #currentPhrase{
    color:#fff;
    font-weight:800;
    line-height:1.1;
    word-break:break-word;
  }
  #currentPhrase.interim{color:rgba(255,255,255,0.55)}
  #currentPhrase.placeholder{color:rgba(255,255,255,0.12);font-weight:600}

  /* Tap to restart hint */
  #tapHint{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    color:rgba(255,255,255,0.25);
    font-size:16px;font-weight:600;
    text-align:center;
    pointer-events:none;
    opacity:0;transition:opacity 0.5s;
    z-index:10;
  }
  #tapHint.show{opacity:1}

  /* ── RECORDING INDICATOR ── */
  #recDot{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top,0px));
    right:16px;
    width:14px;height:14px;
    border-radius:50%;
    background:#ff3b30;
    z-index:50;
    display:none;
  }
  #recDot.on{display:block;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

  /* ── BOTTOM BAR ── */
  #bottomBar{
    position:fixed;
    bottom:0;left:0;right:0;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;justify-content:space-between;
    z-index:50;
    background:linear-gradient(transparent,rgba(0,0,0,0.9) 30%);
  }

  #bottomBar button{
    background:none;border:none;
    color:rgba(255,255,255,0.3);
    font-size:13px;font-weight:600;
    cursor:pointer;padding:10px 12px;
    border-radius:8px;
    font-family:inherit;
  }
  #bottomBar button:active{background:rgba(255,255,255,0.07)}

  #micBtn{
    width:52px;height:52px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.3);
    background:none;color:rgba(255,255,255,0.5);
    display:grid;place-items:center;
    cursor:pointer;transition:all 0.2s;
  }
  #micBtn:active{transform:scale(0.92)}
  #micBtn.on{border-color:#ff3b30;background:rgba(255,59,48,0.15);color:#ff3b30}
  #micBtn svg{width:22px;height:22px;fill:currentColor}

  .sizeRow{
    display:flex;align-items:center;gap:6px;
    position:fixed;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:16px;
    z-index:50;
    opacity:0.35;transition:opacity 0.3s;
  }
  .sizeRow:active,.sizeRow:focus-within{opacity:1}
  .sizeRow label{color:#fff;font-size:13px;font-weight:700}
  .sizeRow input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:80px;height:4px;
    background:rgba(255,255,255,0.2);border-radius:2px;outline:none;
  }
  .sizeRow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;
    background:#fff;border-radius:50%;cursor:pointer;
  }
  .sizeRow span{color:#fff;font-size:12px;font-weight:700;min-width:20px;text-align:center}

  #kbBar{
    position:fixed;bottom:0;left:0;right:0;
    display:none;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(20,20,20,0.98);
    border-top:1px solid rgba(255,255,255,0.1);
    gap:8px;z-index:60;
  }
  #kbBar.show{display:flex}
  #kbBar input{
    flex:1;background:rgba(255,255,255,0.1);
    border:none;border-radius:12px;
    padding:14px 16px;color:#fff;font-size:18px;font-weight:600;outline:none;
  }
  #kbBar input::placeholder{color:rgba(255,255,255,0.2)}
  #kbBar button{
    background:#fff;color:#000;border:none;border-radius:12px;
    padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;
  }
</style>
</head>
<body>

<div id="startScreen">
  <div class="icon">🎤</div>
  <h1>KinéCom</h1>
  <p>Communication soignant → patient<br>Transcription vocale en temps réel</p>
  <button id="btnStart">Démarrer le micro</button>
  <button class="skip" id="btnKeyboard">Mode clavier</button>
</div>

<div id="recDot"></div>
<div id="tapHint">Tapez l'écran pour relancer le micro</div>

<div class="sizeRow" id="sizeRow" style="display:none">
  <label>Aa</label>
  <input type="range" id="sizeSlider" min="24" max="100" value="48">
  <span id="sizeVal">48</span>
</div>

<div id="main">
  <div id="prevPhrase"></div>
  <div id="currentPhrase" class="placeholder">En attente…</div>
</div>

<div id="bottomBar" style="display:none">
  <button id="btnKb">clavier</button>
  <div id="micBtn">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </div>
  <button id="btnClear">effacer</button>
</div>

<div id="kbBar">
  <input type="text" id="kbInput" placeholder="Tapez ou dictez ici…" autocomplete="off" enterkeyhint="send">
  <button id="kbSend">→</button>
</div>

<script>
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ── State ──
  var on = false;
  var rec = null;
  var running = false;
  var phrases = [];
  var interim = '';
  var fontSize = 48;
  var restartCount = 0;
  var timer = null;
  var watchdog = null;

  // ── DOM ──
  var startScreen = document.getElementById('startScreen');
  var main = document.getElementById('main');
  var prevEl = document.getElementById('prevPhrase');
  var currEl = document.getElementById('currentPhrase');
  var recDot = document.getElementById('recDot');
  var micBtn = document.getElementById('micBtn');
  var bottomBar = document.getElementById('bottomBar');
  var sizeRow = document.getElementById('sizeRow');
  var sizeSlider = document.getElementById('sizeSlider');
  var sizeVal = document.getElementById('sizeVal');
  var kbBar = document.getElementById('kbBar');
  var kbInput = document.getElementById('kbInput');
  var tapHint = document.getElementById('tapHint');

  // ── Font size ──
  function applySize(){
    currEl.style.fontSize = fontSize + 'px';
    prevEl.style.fontSize = Math.round(fontSize * 0.55) + 'px';
    sizeVal.textContent = fontSize;
  }
  sizeSlider.addEventListener('input', function(){ fontSize = parseInt(this.value); applySize(); });
  applySize();

  // ══════════════════════════════
  //  START SCREEN
  // ══════════════════════════════

  document.getElementById('btnStart').addEventListener('click', function(){
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({audio:true})
        .then(function(stream){
          stream.getTracks().forEach(function(t){ t.stop(); });
          enterApp(); startMic();
        })
        .catch(function(){ enterApp(); startMic(); });
    } else {
      enterApp(); startMic();
    }
  });

  document.getElementById('btnKeyboard').addEventListener('click', function(){
    enterApp(); showKB();
  });

  function enterApp(){
    startScreen.classList.add('hidden');
    main.classList.add('visible');
    bottomBar.style.display = '';
    sizeRow.style.display = '';
  }

  // ══════════════════════════════════════
  //  SPEECH ENGINE — ROBUST AUTO-RESTART
  // ══════════════════════════════════════

  function makeRec(){
    var r = new SR();
    r.lang = 'fr-FR';
    r.interimResults = true;
    r.maxAlternatives = 1;
    // Always continuous — we handle restarts ourselves
    r.continuous = true;

    r.onstart = function(){
      running = true;
      restartCount = 0;
      tapHint.classList.remove('show');
    };

    r.onaudiostart = function(){
      // Audio is actually flowing — we're good
      running = true;
    };

    r.onresult = function(e){
      restartCount = 0; // reset on any result
      var fin = '', tmp = '';
      for(var i = e.resultIndex; i < e.results.length; i++){
        var t = e.results[i][0].transcript;
        if(e.results[i].isFinal) fin += t;
        else tmp += t;
      }
      if(fin.trim()){ phrases.push(fin.trim()); interim = ''; }
      else { interim = tmp.trim(); }
      render();
    };

    r.onerror = function(e){
      running = false;
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        stopMic();
        currEl.textContent = 'Micro refusé — utilisez le clavier';
        currEl.className = 'placeholder';
        return;
      }
      // For any other error, try to restart
      if(on) scheduleRestart();
    };

    r.onend = function(){
      // This is the KEY event — fires when recognition stops for any reason
      running = false;
      if(on){
        // Commit any pending interim text
        if(interim){
          phrases.push(interim);
          interim = '';
          render();
        }
        scheduleRestart();
      }
    };

    return r;
  }

  function scheduleRestart(){
    clearTimeout(timer);
    restartCount++;

    if(restartCount > 10){
      // Too many restarts — need user tap (Safari limitation)
      tapHint.classList.add('show');
      return;
    }

    // Progressive backoff: 100ms, 200ms, 300ms...
    var delay = Math.min(restartCount * 100, 800);
    timer = setTimeout(function(){
      if(on && !running) startEngine();
    }, delay);
  }

  function startEngine(){
    // Kill any existing instance first
    if(rec){
      try{ rec.abort(); }catch(e){}
      rec = null;
    }
    try{
      rec = makeRec();
      rec.start();
    } catch(e){
      // start() failed — probably needs user gesture on Safari
      if(on) tapHint.classList.add('show');
    }
  }

  // ── Watchdog: detect if engine died silently ──
  function startWatchdog(){
    clearInterval(watchdog);
    watchdog = setInterval(function(){
      if(on && !running){
        scheduleRestart();
      }
    }, 2000);
  }

  function stopWatchdog(){
    clearInterval(watchdog);
  }

  // ══════════════════
  //  MIC ON / OFF
  // ══════════════════

  function startMic(){
    if(!SR){ showKB(); return; }
    on = true;
    restartCount = 0;
    micBtn.classList.add('on');
    recDot.classList.add('on');
    tapHint.classList.remove('show');
    startEngine();
    startWatchdog();
    try{ navigator.wakeLock && navigator.wakeLock.request('screen'); }catch(e){}
  }

  function stopMic(){
    on = false;
    micBtn.classList.remove('on');
    recDot.classList.remove('on');
    tapHint.classList.remove('show');
    clearTimeout(timer);
    stopWatchdog();
    if(rec){ try{ rec.abort(); }catch(e){} rec = null; }
    running = false;
    if(interim){ phrases.push(interim); interim = ''; render(); }
  }

  micBtn.addEventListener('click', function(e){
    e.stopPropagation();
    on ? stopMic() : startMic();
  });

  // ── TAP ANYWHERE to restart (crucial for Safari) ──
  main.addEventListener('click', function(){
    if(kbOpen) { hideKB(); return; }
    if(on && !running){
      restartCount = 0;
      tapHint.classList.remove('show');
      startEngine();
    }
  });

  // ══════════════════
  //  KEYBOARD
  // ══════════════════

  var kbOpen = false;

  function showKB(){
    kbOpen = true;
    kbBar.classList.add('show');
    bottomBar.style.display = 'none';
    kbInput.focus();
  }

  function hideKB(){
    kbOpen = false;
    kbBar.classList.remove('show');
    bottomBar.style.display = '';
  }

  function sendKB(){
    var v = kbInput.value.trim();
    if(v){ phrases.push(v); kbInput.value = ''; render(); }
    kbInput.focus();
  }

  document.getElementById('btnKb').addEventListener('click', function(e){ e.stopPropagation(); showKB(); });
  document.getElementById('kbSend').addEventListener('click', sendKB);
  kbInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendKB(); }});

  // ── Clear ──
  document.getElementById('btnClear').addEventListener('click', function(e){
    e.stopPropagation();
    phrases=[]; interim=''; render();
  });

  // ══════════════════
  //  RENDER — 2 lines
  // ══════════════════

  function render(){
    if(phrases.length >= 2 && !interim)       prevEl.textContent = phrases[phrases.length - 2];
    else if(phrases.length >= 1 && interim)    prevEl.textContent = phrases[phrases.length - 1];
    else                                       prevEl.textContent = '';

    var txt = interim || (phrases.length ? phrases[phrases.length - 1] : '');
    if(txt){
      currEl.textContent = txt;
      currEl.className = interim ? 'interim' : '';
    } else {
      currEl.textContent = on ? 'Parlez…' : 'En attente…';
      currEl.className = 'placeholder';
    }
  }

  // ── iOS: prevent zoom ──
  var lt = 0;
  document.addEventListener('touchstart', function(e){
    var n = Date.now(); if(n - lt < 300) e.preventDefault(); lt = n;
  }, {passive:false});

  // ── Restart on tab return ──
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && on && !running){
      restartCount = 0;
      startEngine();
    }
  });
})();
</script>
</body>
</html>
